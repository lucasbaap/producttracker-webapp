<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ProductTracker — Painel</title>
<style>
  :root {
    --tg-bg: #18222d;
    --tg-text: #e4e4e4;
    --tg-hint: #7d8b99;
    --tg-accent: #2ea6ff;
    --tg-card: #1e2a38;
    --tg-border: #253242;
    --tg-danger: #e74c3c;
    --tg-success: #27ae60;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    padding: 12px;
    max-width: 600px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }
  .header { margin-bottom: 16px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header p { color: var(--tg-hint); font-size: 13px; margin-top: 2px; }
  .loading { text-align: center; padding: 48px 16px; color: var(--tg-hint); font-size: 14px; }
  .card {
    background: var(--tg-card);
    border: 1px solid var(--tg-border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .card:active { background: var(--tg-border); }
  .card.disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon {
    width: 36px; height: 36px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px; flex-shrink: 0;
  }
  .icon.ml { background: #fff159; color: #333; }
  .icon.am { background: #ff9900; color: #fff; }
  .icon.sh { background: #ee4d2d; color: #fff; }
  .icon.ae { background: #e3312b; color: #fff; }
  .icon.kb { background: #0759e6; color: #fff; }
  .info { flex: 1; min-width: 0; }
  .title { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .subtitle { font-size: 12px; color: var(--tg-hint); margin-top: 2px; }
  .price { font-weight: 700; font-size: 15px; }
  .price.down { color: var(--tg-success); }
  .price.up { color: var(--tg-danger); }
  .tag {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 8px; margin-left: 6px;
  }
  .tag.target { background: var(--tg-accent); color: #fff; }
  .detail-screen { animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .btn-group { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .btn {
    display: block; width: 100%; padding: 12px 14px; border: 1px solid var(--tg-border);
    border-radius: var(--radius); background: var(--tg-card); color: var(--tg-text);
    font-size: 14px; font-family: inherit; text-align: left; cursor: pointer;
    transition: background 0.15s; -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: var(--tg-accent); color: #fff; border-color: var(--tg-accent); }
  .btn.danger:active { background: var(--tg-danger); border-color: var(--tg-danger); color: #fff; }
  .btn .emoji { margin-right: 8px; }
  .back {
    display: inline-block; padding: 8px 0; margin-bottom: 8px; font-size: 13px;
    color: var(--tg-accent); cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .input-group { display: flex; gap: 8px; margin-top: 8px; }
  .input-group input {
    flex: 1; padding: 10px 12px; font-size: 16px; border: 1px solid var(--tg-border);
    border-radius: var(--radius-sm); background: var(--tg-bg); color: var(--tg-text);
    font-family: inherit; outline: none;
  }
  .input-group input:focus { border-color: var(--tg-accent); }
  .input-group button {
    padding: 10px 16px; background: var(--tg-accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-weight: 600; font-family: inherit; cursor: pointer;
  }
  .empty { text-align: center; padding: 48px 16px; color: var(--tg-hint); }
  .empty .e { font-size: 40px; display: block; margin-bottom: 12px; }
  .toast {
    position: fixed; bottom: 20px; left: 16px; right: 16px;
    background: var(--tg-accent); color: #fff; text-align: center;
    padding: 10px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    animation: fadeIn 0.3s; z-index: 100;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--tg-border); border-radius: 4px; }
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando...</div></div>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script>
(function () {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // ── Theme ────────────────────────────────────────────────────────
  function applyTheme() {
    var s = tg.colorScheme;
    var r = document.documentElement;
    if (s === "dark") {
      r.style.setProperty("--tg-bg", "#18222d"); r.style.setProperty("--tg-text", "#e4e4e4");
      r.style.setProperty("--tg-hint", "#7d8b99"); r.style.setProperty("--tg-card", "#1e2a38");
      r.style.setProperty("--tg-border", "#253242");
    } else {
      r.style.setProperty("--tg-bg", "#ffffff"); r.style.setProperty("--tg-text", "#222222");
      r.style.setProperty("--tg-hint", "#8e8e93"); r.style.setProperty("--tg-card", "#ffffff");
      r.style.setProperty("--tg-border", "#e0e0e0");
    }
    tg.setBackgroundColor(s === "dark" ? "#18222d" : "#ffffff");
  }
  applyTheme();
  tg.onEvent("themeChanged", applyTheme);

  // ── Config ────────────────────────────────────────────────────────
  var SYM = { BRL: "R$", ARS: "$", MXN: "$", CLP: "$", COP: "$", PEN: "S/" };
  var MKT = { mercadolibre: { l: "ML", c: "ml" }, amazon: { l: "AM", c: "am" },
              shopee: { l: "SH", c: "sh" }, aliexpress: { l: "AE", c: "ae" },
              kabum: { l: "KB", c: "kb" } };
  var API_BASE = null;

  // Try to get API URL from the backend config (passed via query param or env)
  // For now, use the same as the WEBAPP_API_URL configured
  var SCRIPTS = document.getElementsByTagName("script");
  var SRC = SCRIPTS[SCRIPTS.length - 1].src;
  var API_URL = localStorage.getItem("api_url");

  // ── API Helpers ──────────────────────────────────────────────────
  function apiUrl(path) {
    if (!API_URL) return null;
    return API_URL + path + (path.indexOf("?") > -1 ? "&" : "?") + "init_data=" + encodeURIComponent(tg.initData);
  }

  async function apiGet(path) {
    var url = apiUrl(path);
    if (!url) return null;
    try {
      var r = await fetch(url);
      return await r.json();
    } catch (e) {
      return { error: "network_error" };
    }
  }

  async function apiPost(path, body) {
    var url = API_URL + path;
    if (!url) return null;
    try {
      body.init_data = tg.initData;
      var r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      return await r.json();
    } catch (e) {
      return { error: "network_error" };
    }
  }

  function fmtPrice(v, c) { var s = SYM[c] || c+" "; var n = parseFloat(v); return isNaN(n) ? v : s + n.toLocaleString("pt-BR", {minimumFractionDigits: 2}); }
  function pct(a, b) { a = parseFloat(a); b = parseFloat(b); if (!a || !b) return ""; var d = ((b - a) / a) * 100; var sign = d > 0 ? "+" : ""; return sign + d.toFixed(1) + "%"; }
  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

  var user = tg.initDataUnsafe.user || {};
  var products = [];
  var selected = null;

  function render(html) { document.getElementById("app").innerHTML = html; }

  function showToast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2500);
  }

  // ── Screens ──────────────────────────────────────────────────────
  function showHome() {
    selected = null;
    tg.BackButton.hide();
    tg.MainButton.hide();

    if (!products.length) {
      render('<div class="loading">Carregando produtos...</div>');
      loadProducts();
      return;
    }

    var html = '<div class="header"><h1>📊 Produtos</h1><p>' + esc(user.first_name || "Usuário") + ', ' + products.length + ' monitorado(s)</p></div>';
    products.forEach(function (p) {
      var m = MKT[p.marketplace] || { l: "?", c: "ml" };
      var pr = fmtPrice(p.last_price, p.currency_id);
      var change = pct(p.initial_price, p.last_price);
      var dir = parseFloat(p.last_price) < parseFloat(p.initial_price) ? "down" : "up";
      html += '<div class="card" onclick="showDetail(' + p.id + ')"><div class="row">' +
        '<div class="icon ' + m.c + '">' + m.l + '</div>' +
        '<div class="info"><div class="title">' + esc(p.title && p.title.length > 45 ? p.title.slice(0,45)+"…" : p.title) + '</div>' +
        '<div class="subtitle"><span class="price ' + dir + '">' + pr + '</span> <span style="font-size:11px">' + change + '</span>' +
        (p.target_price ? '<span class="tag target">🎯 ' + fmtPrice(p.target_price, p.currency_id) + '</span>' : '') +
        '</div></div></div></div>';
    });
    html += '<div style="text-align:center;margin-top:4px;font-size:11px;color:var(--tg-hint)">🔄 Puxe para atualizar</div>';
    render(html);
  }

  async function loadProducts() {
    try {
      var data = await apiGet("/api/products");
      if (data && data.ok) {
        products = data.products || [];
      } else {
        render('<div class="empty"><span class="e">⚠️</span>Erro ao carregar<br><span style="font-size:12px">' + esc(data ? data.error : "sem resposta") + '</span></div>');
        return;
      }
    } catch (e) {
      render('<div class="empty"><span class="e">📡</span>Erro de conexão<br><span style="font-size:12px">Verifique se a API está no ar</span></div>');
      return;
    }
    showHome();
  }

  function showDetail(id) {
    var p = products.find(function (x) { return x.id === id; });
    if (!p) return;
    selected = p;
    tg.BackButton.show();
    tg.BackButton.onClick(function () { showHome(); });
    tg.MainButton.hide();

    var m = MKT[p.marketplace] || { l: "?", c: "ml" };
    var pr = fmtPrice(p.last_price, p.currency_id);
    var initPr = fmtPrice(p.initial_price, p.currency_id);
    var change = pct(p.initial_price, p.last_price);
    var dir = parseFloat(p.last_price) < parseFloat(p.initial_price) ? "down" : "up";

    var html = '<div class="detail-screen"><div class="back" onclick="showHome()">← Voltar</div>' +
      '<div class="card disabled"><div class="row">' +
      '<div class="icon ' + m.c + '">' + m.l + '</div>' +
      '<div class="info"><div class="title">' + esc(p.title || "") + '</div>' +
      '<div class="subtitle">Cadastro: ' + initPr + '</div></div></div></div>' +
      '<div style="font-size:24px;font-weight:700;text-align:center;padding:8px 0">' +
      '<span class="price ' + dir + '">' + pr + '</span>' +
      '<span style="font-size:14px;font-weight:400;margin-left:8px;color:var(--tg-hint)">' + change + '</span></div>' +
      (p.target_price ? '<div style="text-align:center;font-size:13px;color:var(--tg-hint)">🎯 Meta: ' + fmtPrice(p.target_price, p.currency_id) + '</div>' : '');

    html += '<div class="btn-group">';
    if (p.target_price) {
      html += '<div class="btn" onclick="editTarget()"><span class="emoji">✏️</span> Alterar meta (' + fmtPrice(p.target_price, p.currency_id) + ')</div>' +
        '<div class="btn danger" onclick="removeTarget()"><span class="emoji">🔕</span> Remover meta</div>';
    } else {
      html += '<div class="btn" onclick="editTarget()"><span class="emoji">🎯</span> Definir meta de preço</div>';
    }
    html += '<div class="btn danger" onclick="doRemove()"><span class="emoji">🗑️</span> Parar de monitorar</div></div></div>';

    render(html);
  }

  function editTarget() {
    if (!selected) return;
    var cur = selected.target_price ? " (atual: " + fmtPrice(selected.target_price, selected.currency_id) + ")" : "";
    render(
      '<div class="detail-screen"><div class="back" onclick="showDetail(' + selected.id + ')">← Voltar</div>' +
      '<div style="margin-top:8px"><strong>🎯 Meta de preço</strong>' +
      '<p style="font-size:13px;color:var(--tg-hint);margin:4px 0 12px">Valor mínimo para ser avisado' + cur + '</p>' +
      '<div class="input-group">' +
      '<span style="padding:10px 0;font-size:16px;font-weight:600;color:var(--tg-hint)">R$</span>' +
      '<input id="tv" type="number" step="0.01" min="0" placeholder="Ex: 50" autofocus></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
      '<button class="btn" style="flex:1;text-align:center" onclick="confirmTarget()">✅ Salvar</button>' +
      '<button class="btn danger" style="flex:1;text-align:center" onclick="showDetail(' + selected.id + ')">Cancelar</button></div></div>'
    );
    tg.BackButton.onClick(function () { showDetail(selected.id); });
  }

  async function confirmTarget() {
    var input = document.getElementById("tv");
    var val = parseFloat(input.value.replace(",", "."));
    if (isNaN(val) || val < 0) { showToast("Digite um valor válido"); return; }
    if (val === 0) { removeTarget(); return; }

    var res = await apiPost("/api/action", { action: "set_target", product_id: selected.id, target_price: val });
    if (res && res.ok) {
      showToast("🎯 Meta alterada para " + fmtPrice(val, selected.currency_id));
      await loadProducts();
    } else {
      showToast("Erro: " + (res ? res.error : "sem resposta"));
    }
  }

  async function removeTarget() {
    var res = await apiPost("/api/action", { action: "remove_target", product_id: selected.id });
    if (res && res.ok) {
      showToast("🔕 Meta removida");
      await loadProducts();
    } else {
      showToast("Erro: " + (res ? res.error : "sem resposta"));
    }
  }

  async function doRemove() {
    if (!selected) return;
    tg.showConfirm("Remover \"" + selected.title.slice(0, 40) + "\"?", async function (ok) {
      if (ok) {
        var res = await apiPost("/api/action", { action: "remove", product_id: selected.id });
        if (res && res.ok) {
          showToast("🗑️ Produto removido");
          await loadProducts();
        } else {
          showToast("Erro: " + (res ? res.error : "sem resposta"));
        }
      }
    });
  }

  // ── Init ─────────────────────────────────────────────────────────
  window.showHome = showHome;
  window.showDetail = showDetail;
  window.editTarget = editTarget;
  window.confirmTarget = confirmTarget;
  window.removeTarget = removeTarget;
  window.doRemove = doRemove;

  // Set API URL from the page URL query param or use localhost for dev
  var params = new URLSearchParams(window.location.search);
  API_URL = params.get("api_url") || localStorage.getItem("api_url") || "http://localhost:9099";
  localStorage.setItem("api_url", API_URL);

  console.log("API_URL:", API_URL);
  showHome();
})();
</script>
</body>
</html>
