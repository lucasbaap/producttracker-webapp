<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ProductTracker — Painel</title>
<style>
  :root {
    --tg-bg: #18222d;
    --tg-bg-secondary: #1c2735;
    --tg-text: #e4e4e4;
    --tg-hint: #7d8b99;
    --tg-accent: #2ea6ff;
    --tg-accent-text: #fff;
    --tg-danger: #e74c3c;
    --tg-success: #27ae60;
    --tg-card: #1e2a38;
    --tg-border: #253242;
    --tg-section-header: #6a7b8d;
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--tg-bg);
    color: var(--tg-text);
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
  }

  .header { margin-bottom: 20px; }
  .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .header p { color: var(--tg-hint); font-size: 14px; }

  .card {
    background: var(--tg-card);
    border: 1px solid var(--tg-border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .action-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .action-card {
    background: var(--tg-card);
    border: 1px solid var(--tg-border);
    border-radius: var(--radius);
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .action-card:active {
    background: var(--tg-accent);
    border-color: var(--tg-accent);
  }
  .action-card.danger:active {
    background: var(--tg-danger);
    border-color: var(--tg-danger);
  }
  .action-card .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
  .action-card .label { font-size: 13px; font-weight: 600; }

  .step-indicator {
    display: flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    margin: 16px 0;
  }
  .step-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--tg-border);
    transition: background 0.3s;
  }
  .step-dot.active { background: var(--tg-accent); }

  .result-screen {
    text-align: center;
    padding: 40px 16px;
  }
  .result-screen .big-emoji { font-size: 48px; display: block; margin-bottom: 16px; }
  .result-screen h2 { font-size: 18px; margin-bottom: 8px; }
  .result-screen p { color: var(--tg-hint); font-size: 14px; line-height: 1.5; }

  .input-group {
    display: flex;
    gap: 8px;
    margin: 16px 0;
  }
  .input-group input {
    flex: 1;
    padding: 12px 14px;
    font-size: 16px;
    border: 1px solid var(--tg-border);
    border-radius: var(--radius-sm);
    background: var(--tg-bg);
    color: var(--tg-text);
    font-family: inherit;
    outline: none;
  }
  .input-group input:focus { border-color: var(--tg-accent); }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--tg-accent); color: var(--tg-accent-text); }
  .btn-danger { background: var(--tg-danger); color: #fff; }
  .btn-secondary { background: var(--tg-bg-secondary); color: var(--tg-text); border: 1px solid var(--tg-border); }

  .flex { display: flex; gap: 8px; }
  .flex-center { justify-content: center; }
  .mt-16 { margin-top: 16px; }
  .mb-12 { margin-bottom: 12px; }
  .w-full { width: 100%; }

  #app > div { animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--tg-border); border-radius: 4px; }
</style>
</head>
<body>

<div id="app"></div>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script>
(function () {
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  // ── Theme ────────────────────────────────────────────────────────
  function applyTheme() {
    var scheme = tg.colorScheme;
    var root = document.documentElement;
    if (scheme === "dark") {
      root.style.setProperty("--tg-bg", "#18222d");
      root.style.setProperty("--tg-bg-secondary", "#1c2735");
      root.style.setProperty("--tg-text", "#e4e4e4");
      root.style.setProperty("--tg-hint", "#7d8b99");
      root.style.setProperty("--tg-card", "#1e2a38");
      root.style.setProperty("--tg-border", "#253242");
      root.style.setProperty("--tg-accent", "#2ea6ff");
      root.style.setProperty("--tg-section-header", "#6a7b8d");
    } else {
      root.style.setProperty("--tg-bg", "#ffffff");
      root.style.setProperty("--tg-bg-secondary", "#f0f2f5");
      root.style.setProperty("--tg-text", "#222222");
      root.style.setProperty("--tg-hint", "#8e8e93");
      root.style.setProperty("--tg-card", "#ffffff");
      root.style.setProperty("--tg-border", "#e0e0e0");
      root.style.setProperty("--tg-accent", "#007aff");
      root.style.setProperty("--tg-section-header", "#8e8e93");
    }
    tg.setHeaderColor(scheme === "dark" ? "bg_color" : "bg_color");
    tg.setBackgroundColor(scheme === "dark" ? "#18222d" : "#ffffff");
  }
  applyTheme();
  tg.onEvent("themeChanged", applyTheme);

  // ── User ─────────────────────────────────────────────────────────
  var initUser = tg.initDataUnsafe.user || {};
  var userName = initUser.first_name || "Usuário";

  // ── State ─────────────────────────────────────────────────────────
  var state = {
    screen: "home",       // home | done_target | done_remove | done_list
    selectedProductId: null,
    selectedProductTitle: "",
    selectedProductCurrency: "BRL",
  };

  // ── Helpers ───────────────────────────────────────────────────────
  var SYMBOLS = { BRL: "R$", ARS: "$", MXN: "$", CLP: "$", COP: "$", PEN: "S/" };

  function fmtPrice(val, cur) {
    var sym = SYMBOLS[cur] || cur + " ";
    var n = parseFloat(val);
    return isNaN(n) ? val : sym + n.toLocaleString("pt-BR", { minimumFractionDigits: 2 });
  }

  function sendAction(action, extra) {
    var payload = Object.assign({ action: action, init_data: tg.initData }, extra || {});
    try {
      tg.sendData(JSON.stringify(payload));
    } catch (e) {
      tg.showAlert("Erro ao comunicar com o bot.");
    }
  }

  function render(html) {
    document.getElementById("app").innerHTML = html;
  }

  function goHome() {
    state.screen = "home";
    tg.BackButton.hide();
    renderHome();
  }

  function showResult(emoji, title, msg, btnText, btnAction) {
    state.screen = "done";
    tg.BackButton.show();
    tg.BackButton.onClick(function () { tg.close(); });

    render(
      '<div class="result-screen">' +
      '<span class="big-emoji">' + emoji + '</span>' +
      '<h2>' + title + '</h2>' +
      '<p>' + msg + '</p>' +
      '<div class="mt-16 flex flex-center">' +
      '<button class="btn btn-primary" onclick="' + btnAction + '">' + btnText + '</button>' +
      '<button class="btn btn-secondary" onclick="tg.close()">Fechar</button>' +
      '</div></div>'
    );
  }

  // ── Screens ───────────────────────────────────────────────────────
  function renderHome() {
    state.screen = "home";
    tg.BackButton.hide();

    render(
      '<div class="header">' +
      '<h1>📊 ProductTracker</h1>' +
      '<p>Olá, ' + escapeHtml(userName) + '! Escolha uma ação:</p>' +
      '</div>' +

      '<div class="action-grid">' +
      '<div class="action-card" onclick="sendList()">' +
      '<span class="emoji">📋</span>' +
      '<span class="label">Ver produtos</span>' +
      '</div>' +
      '<div class="action-card" onclick="askProductId(\'set_target\')">' +
      '<span class="emoji">🎯</span>' +
      '<span class="label">Definir alvo</span>' +
      '</div>' +
      '<div class="action-card" onclick="askProductId(\'remove\')">' +
      '<span class="emoji">🗑️</span>' +
      '<span class="label">Remover</span>' +
      '</div>' +
      '<div class="action-card" onclick="askProductId(\'remove_target\')">' +
      '<span class="emoji">🔕</span>' +
      '<span class="label">Remover alvo</span>' +
      '</div>' +
      '</div>' +

      '<div class="card" style="text-align:center;padding:12px;font-size:13px;color:var(--tg-hint)">' +
      'As ações são executadas no chat do bot. Abra o chat para ver a confirmação.' +
      '</div>'
    );
  }

  function askProductId(action) {
    state.selectedAction = action;
    state.screen = "ask_product";

    var actionLabels = {
      set_target: "Definir alvo",
      remove: "Remover",
      remove_target: "Remover alvo",
    };

    tg.BackButton.show();
    tg.BackButton.onClick(function () { goHome(); });

    render(
      '<div class="header">' +
      '<h1>' + actionLabels[action] + '</h1>' +
      '<p>Digite o número do produto (use /list para ver os IDs).</p>' +
      '</div>' +
      '<input id="pid-input" class="w-full" style="padding:12px 14px;font-size:16px;border:1px solid var(--tg-border);border-radius:8px;background:var(--tg-bg);color:var(--tg-text);font-family:inherit;outline:none" placeholder="Ex: 1" autofocus>' +
      '<div class="flex mt-16">' +
      '<button class="btn btn-primary w-full" onclick="confirmProductId()">Continuar</button>' +
      '</div>' +
      '<div class="mt-16 flex flex-center">' +
      '<button class="btn btn-secondary" onclick="goHome()">Voltar</button>' +
      '</div>'
    );
  }

  function confirmProductId() {
    var input = document.getElementById("pid-input");
    var pid = parseInt(input.value);
    if (!pid || pid < 1) {
      tg.showAlert("Digite um número válido.");
      return;
    }

    var action = state.selectedAction;

    if (action === "remove") {
      sendAction("remove", { product_id: pid });
      showResult(
        "🗑️",
        "Removendo produto...",
        "O produto #" + pid + " será removido. Confira a confirmação no chat do bot.",
        "🏠 Voltar ao início", "goHome()"
      );
    } else if (action === "remove_target") {
      sendAction("remove_target", { product_id: pid });
      showResult(
        "🔕",
        "Removendo alvo...",
        "O alvo do produto #" + pid + " será removido. Confira no chat.",
        "🏠 Voltar ao início", "goHome()"
      );
    } else if (action === "set_target") {
      askTargetValue(pid);
    }
  }

  function askTargetValue(productId) {
    state.selectedProductId = productId;
    state.screen = "ask_target";

    tg.BackButton.show();
    tg.BackButton.onClick(function () { goHome(); });

    render(
      '<div class="header">' +
      '<h1>🎯 Definir alvo</h1>' +
      '<p>Produto #' + productId + '.<br>Qual o valor mínimo para te avisar?</p>' +
      '</div>' +
      '<div class="input-group">' +
      '<span style="padding:12px 0;font-size:16px;font-weight:600;color:var(--tg-hint)">R$</span>' +
      '<input id="target-input" type="number" step="0.01" min="0" placeholder="Ex: 50,00" autofocus>' +
      '</div>' +
      '<div class="flex">' +
      '<button class="btn btn-primary w-full" onclick="confirmTarget()">Salvar alvo</button>' +
      '</div>' +
      '<div class="mt-16 flex flex-center">' +
      '<button class="btn btn-secondary" onclick="goHome()">Cancelar</button>' +
      '</div>'
    );
  }

  function confirmTarget() {
    var input = document.getElementById("target-input");
    var val = parseFloat(input.value.replace(",", "."));
    if (isNaN(val) || val < 0) {
      tg.showAlert("Digite um valor numérico válido.");
      return;
    }
    if (val === 0) {
      sendAction("remove_target", { product_id: state.selectedProductId });
      showResult("🔕", "Alvo removido", "Confira a confirmação no chat.", "🏠 Voltar", "goHome()");
      return;
    }
    sendAction("set_target", { product_id: state.selectedProductId, target_price: val });
    showResult(
      "🎯",
      "Alvo definido!",
      "Alvo de " + fmtPrice(val, "BRL") + " enviado para o produto #" + state.selectedProductId + ". Confira no chat.",
      "🏠 Voltar ao início", "goHome()"
    );
  }

  function sendList() {
    sendAction("list");
    showResult(
      "📋",
      "Lista enviada!",
      "Abra o chat do bot para ver sua lista de produtos com preços e variações.",
      "🏠 Voltar ao início", "goHome()"
    );
  }

  function escapeHtml(text) {
    if (!text) return "";
    var d = document.createElement("div");
    d.textContent = text;
    return d.innerHTML;
  }

  // ── Init ─────────────────────────────────────────────────────────
  window.sendList = sendList;
  window.askProductId = askProductId;
  window.confirmProductId = confirmProductId;
  window.askTargetValue = askTargetValue;
  window.confirmTarget = confirmTarget;
  window.goHome = goHome;

  renderHome();
})();
</script>
</body>
</html>
