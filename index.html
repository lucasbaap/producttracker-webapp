<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ProductTracker</title>
<style>
  :root {
    --bg: #0f1729; --card: #172033; --border: #1e2c42; --text: #e2e8f0;
    --muted: #6b7d95; --accent: #3b82f6; --green: #22c55e; --red: #ef4444;
    --green-bg: rgba(34, 197, 94, 0.08); --red-bg: rgba(239, 68, 68, 0.08);
    --radius: 14px; --radius-sm: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; max-width: 600px;
    margin: 0 auto; -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }
  .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .header-left p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .header-actions { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--border); display: flex; align-items: center;
    justify-content: center; cursor: pointer; color: var(--muted); transition: all 0.15s;
  }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .icon-btn:active svg { color: #fff; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-bar {
    flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-sm); transition: border-color 0.2s;
  }
  .search-bar:focus-within { border-color: var(--accent); }
  .search-bar svg { opacity: 0.4; flex-shrink: 0; }
  .search-bar input {
    flex: 1; border: none; outline: none; background: transparent; color: var(--text);
    font-size: 14px; font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .sort-btn {
    position: relative; display: flex; align-items: center; justify-content: center; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer;
    white-space: nowrap; gap: 4px; user-select: none;
  }
  .sort-btn:active { opacity: 0.7; }
  .sort-menu {
    display: none; position: absolute; top: 44px; right: 0; min-width: 140px;
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; z-index: 10; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .sort-menu.open { display: block; }
  .sort-menu div {
    padding: 10px 14px; font-size: 13px; cursor: pointer; color: var(--text);
    transition: background 0.1s;
  }
  .sort-menu div:active, .sort-menu div.active { background: rgba(59,130,246,0.15); color: var(--accent); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    cursor: pointer; transition: all 0.12s; user-select: none;
    -webkit-tap-highlight-color: transparent; position: relative;
    overflow: hidden;
  }
  .card:active { opacity: 0.7; }
  .card.down { border-left: 3px solid var(--green); background: linear-gradient(90deg, var(--green-bg) 0%, var(--card) 8%); }
  .card.up { border-left: 3px solid var(--red); background: linear-gradient(90deg, var(--red-bg) 0%, var(--card) 8%); }
  .card.flat { border-left: 3px solid var(--border); }
  .card.disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; align-items: center; gap: 12px; }
  .mkt-badge {
    width: 38px; height: 38px; border-radius: var(--radius-sm); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 11px; letter-spacing: 0.02em;
  }
  .mkt-badge.ml { background: #ffd700; color: #1a1a1a; }
  .mkt-badge.am { background: #ff8c00; color: #111; }
  .mkt-badge.sh { background: #ff4d2d; color: #fff; }
  .mkt-badge.ae { background: #e3312b; color: #fff; }
  .mkt-badge.kb { background: #1a73e8; color: #fff; }
  .info { flex: 1; min-width: 0; }
  .p-title { font-size: 14px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .p-price { font-weight: 700; font-size: 15px; }
  .p-price.down { color: var(--green); }
  .p-price.up { color: var(--red); }
  .p-change { font-size: 11px; font-weight: 600; }
  .p-target {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; background: rgba(59, 130, 246, 0.15); color: var(--accent);
    margin-left: 6px; letter-spacing: 0.02em;
  }

  .chk {
    width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 13px; transition: all 0.15s; color: transparent;
  }
  .chk.checked { background: var(--red); border-color: var(--red); color: #fff; }

  .detail { animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .back-btn { display: inline-block; padding: 6px 0; margin-bottom: 12px; font-size: 14px; color: var(--accent); cursor: pointer; font-weight: 500; }

  .btn {
    display: block; width: 100%; padding: 13px 16px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--card); color: var(--text);
    font-size: 14px; font-family: inherit; text-align: left; cursor: pointer;
    transition: all 0.12s; -webkit-tap-highlight-color: transparent; margin-bottom: 8px;
  }
  .btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.red:active { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.full { text-align: center; }

  .detail-table { margin: 12px 0; }
  .dt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .dt-row:last-child { border-bottom: none; }
  .dt-label { font-size: 13px; color: var(--muted); }
  .dt-value { font-size: 14px; font-weight: 600; }
  .dt-value.down { color: var(--green); }
  .dt-value.up { color: var(--red); }

  .input-row { display: flex; gap: 8px; margin-top: 8px; }
  .input-row input {
    flex: 1; padding: 12px 14px; font-size: 16px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--bg); color: var(--text);
    font-family: inherit; outline: none; transition: border-color 0.2s;
  }
  .input-row input:focus { border-color: var(--accent); }
  .input-row button {
    padding: 12px 18px; background: var(--accent); color: #fff; border: none;
    border-radius: var(--radius-sm); font-weight: 600; font-family: inherit; cursor: pointer;
  }

  .empty-state { text-align: center; padding: 64px 16px; color: var(--muted); }
  .empty-state .icon { font-size: 44px; display: block; margin-bottom: 16px; opacity: 0.5; }
  .empty-state p { font-size: 14px; line-height: 1.5; }

  .toast {
    position: fixed; bottom: 24px; left: 16px; right: 16px; max-width: 400px; margin: 0 auto;
    background: #1e293b; color: #fff; text-align: center; padding: 12px; border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 600; animation: fadeIn 0.3s; z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .loading-state { text-align: center; padding: 60px 16px; }
  .loading-state .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-state p { color: var(--muted); font-size: 13px; }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>document.getElementById("app").innerHTML = '<div class="loading">Carregando...</div>';</script>

<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<script>
(function () {
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();

  function applyTheme() {
    var s = tg.colorScheme; var r = document.documentElement;
    if (s === "dark") {
      r.style.setProperty("--bg", "#0f1729"); r.style.setProperty("--card", "#172033");
      r.style.setProperty("--border", "#1e2c42"); r.style.setProperty("--text", "#e2e8f0");
      r.style.setProperty("--muted", "#6b7d95");
    } else {
      r.style.setProperty("--bg", "#f8fafc"); r.style.setProperty("--card", "#ffffff");
      r.style.setProperty("--border", "#e2e8f0"); r.style.setProperty("--text", "#1e293b");
      r.style.setProperty("--muted", "#94a3b8");
    }
    tg.setBackgroundColor(s === "dark" ? "#0f1729" : "#f8fafc");
  }
  applyTheme(); tg.onEvent("themeChanged", applyTheme);

  var SYM = { BRL: "R$", ARS: "$", MXN: "$", CLP: "$", COP: "$", PEN: "S/" };
  var MKT = { mercadolibre: { l: "ML", c: "ml", full: "Mercado Livre", prep: "no" },
              amazon: { l: "AM", c: "am", full: "Amazon", prep: "na" },
              shopee: { l: "SH", c: "sh", full: "Shopee", prep: "na" },
              aliexpress: { l: "AE", c: "ae", full: "AliExpress", prep: "no" },
              kabum: { l: "KB", c: "kb", full: "KaBuM!", prep: "na" } };
  var API_URL = "";

  var products = [], allProducts = [], selected = null, productsLoaded = false;
  var deleteMode = false, selectedList = [], sortBy = "default", searchQuery = "";

  function fmtPrice(v, c) { var s = SYM[c] || c+" "; var n = parseFloat(v); return isNaN(n) ? v : s + n.toLocaleString("pt-BR", {minimumFractionDigits: 2}); }
  function pct(a, b) { a = parseFloat(a); b = parseFloat(b); if (!a || !b) return ""; var d = ((b - a) / a) * 100; var sign = d > 0 ? "+" : ""; return sign + d.toFixed(1) + "%"; }
  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function trend(p) { var d = parseFloat(p.last_price) - parseFloat(p.initial_price); return d < 0 ? "down" : d > 0 ? "up" : "flat"; }
  function render(h) { document.getElementById("app").innerHTML = h; }

  function showToast(msg) {
    var t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }

  // ── Sort & Filter ─────────────────────────────────────────────────
  function applyFilters() {
    var list = allProducts.slice();
    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      list = list.filter(function (p) { return (p.title || "").toLowerCase().indexOf(q) >= 0; });
    }
    var mktOrder = ["mercadolibre","amazon","aliexpress","shopee","kabum"];
    if (sortBy === "name") list.sort(function (a, b) { return (a.title || "").localeCompare(b.title || ""); });
    else if (sortBy === "price") list.sort(function (a, b) { return parseFloat(a.last_price) - parseFloat(b.last_price); });
    else if (sortBy === "store") list.sort(function (a, b) { return mktOrder.indexOf(a.marketplace) - mktOrder.indexOf(b.marketplace); });
    products = list;
  }

  function renderToolbar() {
    var labels = { default: "Padrão", name: "A → Z", price: "Preço", store: "Loja" };
    var sel = sortBy;
    return '<div class="toolbar">' +
      '<div class="search-bar">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>' +
      '<input id="search" type="text" placeholder="Buscar..." value="' + esc(searchQuery) + '">' +
      '</div>' +
      '<div class="sort-btn" onclick="toggleSortMenu()">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M10 18h4"/></svg>' +
      labels[sel] +
      '<div class="sort-menu" id="sort-menu">' +
      '<div class="' + (sel === "default" ? "active" : "") + '" onclick="setSort(\'default\')">Padrão</div>' +
      '<div class="' + (sel === "name" ? "active" : "") + '" onclick="setSort(\'name\')">A → Z</div>' +
      '<div class="' + (sel === "price" ? "active" : "") + '" onclick="setSort(\'price\')">Preço</div>' +
      '<div class="' + (sel === "store" ? "active" : "") + '" onclick="setSort(\'store\')">Loja</div>' +
      '</div></div></div>';
  }

  function toggleSortMenu() {
    var m = document.getElementById("sort-menu"); m.classList.toggle("open");
  }

  function setSort(s) { sortBy = s; applyFilters(); showHome(); }

  // Close sort menu on outside click
  document.addEventListener("click", function (e) {
    var menu = document.getElementById("sort-menu");
    if (menu && !e.target.closest(".sort-btn")) menu.classList.remove("open");
  });

  // ── Screens ───────────────────────────────────────────────────────
  function renderProductCards() {
    var container = document.getElementById("product-cards");
    if (!container) return;
    applyFilters();
    var html = '';
    if (!products.length) {
      html = '<div class="empty-state"><span class="icon">🔍</span><p>Nenhum produto encontrado<br>para "' + esc(searchQuery) + '"</p></div>';
    } else {
      products.forEach(function (p) {
        var m = MKT[p.marketplace] || { l: "?", c: "ml" };
        var t = trend(p); var ch = pct(p.initial_price, p.last_price);
        html += '<div class="card ' + t + '" onclick="showDetail(' + p.id + ')"><div class="row">' +
          '<div class="mkt-badge ' + m.c + '">' + m.l + '</div><div class="info">' +
          '<div class="p-title">' + esc(p.title || "").slice(0, 52) + '</div>' +
          '<div class="p-meta">' +
          '<span class="p-price ' + t + '">' + fmtPrice(p.last_price, p.currency_id) + '</span>' +
          '<span class="p-change">' + ch + '</span>' +
          (p.target_price ? '<span class="p-target">' + fmtPrice(p.target_price, p.currency_id) + '</span>' : '') +
          '</div></div></div></div>';
      });
    }
    container.innerHTML = html;
  }

  function onSearch(q) {
    searchQuery = q;
    renderProductCards();
    document.getElementById("search").focus();
  }

  function showHome() {
    selected = null; deleteMode = false; selectedList = [];
    tg.BackButton.hide(); tg.MainButton.hide();

    if (!productsLoaded) { renderLoading(); loadProducts(); return; }
    if (!allProducts.length) { renderEmpty(); return; }

    applyFilters();
    var shown = allProducts.length;
    var subtitle = "Monitorando " + shown + " produto" + (shown !== 1 ? "s" : "");
    if (searchQuery) { var c = products.length; subtitle = c + " de " + shown + " resultado" + (c !== 1 ? "s" : ""); }

    var html =
      '<div class="header"><div class="header-left"><h1>Meus produtos</h1><p>' + subtitle + '</p></div>' +
      '<div class="header-actions">' +
      '<div class="icon-btn" onclick="enterDeleteMode()" title="Remover">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></div>' +
      '<div class="icon-btn" onclick="location.reload()" title="Atualizar">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0115.36-6.36L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 01-15.36 6.36L3 16"/></svg></div>' +
      '</div></div>' + renderToolbar() + '<div id="product-cards"></div>';

    render(html);
    renderProductCards();
    var si = document.getElementById("search");
    if (si) si.addEventListener("input", function () { onSearch(this.value); });
  }

  function renderLoading() { render('<div class="loading-state"><div class="spinner"></div><p>Carregando produtos...</p></div>'); }
  function renderEmpty() { render('<div class="header"><h1>Meus produtos</h1></div><div class="empty-state"><span class="icon">📦</span><p>Nenhum produto monitorado.<br>Envie um link no chat para começar.</p></div>'); }

  function enterDeleteMode() {
    deleteMode = true; selectedList = [];
    tg.BackButton.show(); tg.BackButton.onClick(function () { showHome(); });
    tg.MainButton.show(); tg.MainButton.setText("Remover"); tg.MainButton.setParams({ color: "#ef4444" });
    tg.MainButton.onClick(function () { confirmDelete(); }); tg.MainButton.disable();

    var n = allProducts.length;
    var html = '<div class="header" style="align-items:center"><div class="header-left"><h1>Remover produtos</h1><p>Toque nos itens para selecionar</p></div></div>' +
      '<div class="btn full" id="toggle-all-btn" onclick="toggleAll()" style="margin-bottom:14px">Selecionar ' + n + ' produto' + (n !== 1 ? "s" : "") + '</div>';

    allProducts.forEach(function (p) {
      var m = MKT[p.marketplace] || { l: "?", c: "ml" };
      var id = parseInt(p.id);
      html += '<div class="card" onclick="toggleSelect(' + id + ')" id="sel-' + id + '"><div class="row">' +
        '<div class="chk" id="chk-' + id + '"></div>' +
        '<div class="mkt-badge ' + m.c + '">' + m.l + '</div><div class="info">' +
        '<div class="p-title">' + esc(p.title || "").slice(0, 52) + '</div>' +
        '<div class="p-meta">' + fmtPrice(p.last_price, p.currency_id) + '</div></div></div></div>';
    });

    html += '<div class="btn full red" onclick="deleteAll()" style="margin-top:14px">Remover todos os produtos</div>' +
      '<div class="btn full" onclick="showHome()" style="margin-top:4px">Cancelar</div>';

    render(html);
  }

  function updateDeleteUI() {
    var count = selectedList.length;
    var n = allProducts.length;
    tg.MainButton.setText("Remover " + count + " produto" + (count !== 1 ? "s" : ""));
    count > 0 ? tg.MainButton.enable() : tg.MainButton.disable();
    var allBtn = document.getElementById("toggle-all-btn");
    if (allBtn) allBtn.textContent = count === n ? "Desmarcar todos" : "Selecionar " + n + " produto" + (n !== 1 ? "s" : "");
  }

  var _toggling = false;

  function toggleSelect(id) {
    if (_toggling) return;
    _toggling = true;
    id = parseInt(id);
    var idx = selectedList.indexOf(id);
    if (idx >= 0) { selectedList.splice(idx, 1); } else { selectedList.push(id); }
    // Update checkbox UI
    var chk = document.getElementById("chk-" + id);
    if (chk) { var sel = selectedList.indexOf(id) >= 0; chk.className = sel ? "chk checked" : "chk"; chk.textContent = sel ? "✓" : ""; }
    updateDeleteUI();
    setTimeout(function () { _toggling = false; }, 150);
  }

  function toggleAll() {
    var allSel = selectedList.length === allProducts.length;
    var n = allProducts.length;
    selectedList = allSel ? [] : allProducts.map(function (p) { return parseInt(p.id); });
    allProducts.forEach(function (p) {
      var id = parseInt(p.id); var sel = !allSel;
      var chk = document.getElementById("chk-" + id);
      if (chk) { chk.className = sel ? "chk checked" : "chk"; chk.textContent = sel ? "✓" : ""; }
    });
    updateDeleteUI();
  }

  function confirmDelete() {
    if (!selectedList.length) return;
    tgConfirm("Remover " + selectedList.length + " produto" + (selectedList.length !== 1 ? "s" : "") + "?").then(function (ok) { if (ok) doDelete(selectedList); });
  }

  function deleteAll() {
    tgConfirm("Remover todos os " + allProducts.length + " produtos?").then(function (ok) { if (ok) doDelete(allProducts.map(function (p) { return p.id; })); });
  }

  async function doDelete(ids) {
    for (var i = 0; i < ids.length; i++) {
      var res = await apiPost("/api/action", { action: "remove", product_id: parseInt(ids[i]) }); if (!res || !res.ok) { showToast("Erro ao remover #" + ids[i]); return; }
    }
    showToast(ids.length + " removido" + (ids.length !== 1 ? "s" : "")); await loadProducts();
  }

  function showDetail(id) {
    var p = allProducts.find(function (x) { return x.id === id; }); if (!p) return;
    selected = p; tg.BackButton.show(); tg.BackButton.onClick(function () { showHome(); }); tg.MainButton.hide();
    window.scrollTo(0, 0);

    var m = MKT[p.marketplace] || { l: "?", c: "ml" };
    var t = trend(p); var ch = pct(p.initial_price, p.last_price);
    var linkUrl = p.affiliate_url || p.url || "";
    var addedDate = "";
    if (p.added_at) {
      try { var d = new Date(p.added_at); addedDate = " (" + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()).slice(-2) + ")"; } catch(e) {}
    }

    var html = '<div class="detail">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">' +
      '<div class="back-btn" onclick="showHome()">← Voltar</div>' +
      '<div class="icon-btn" onclick="shareProduct()" title="Copiar link" style="width:34px;height:34px">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></div>' +
      '</div>' +
      '<div class="card disabled"><div class="row"><div class="mkt-badge ' + m.c + '">' + m.l + '</div>' +
      '<div class="info"><div class="p-title">' + esc(p.title || "") + '</div><div class="p-meta">' + m.full + '</div></div></div></div>' +

      (linkUrl ? '<a href="' + linkUrl + '" target="_blank" style="display:block;margin-bottom:12px;padding:13px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;text-align:center">Ver ' + (m.prep||"no") + ' ' + m.full + '</a>' : '') +

      '<div class="detail-table">' +
      '<div class="dt-row"><span class="dt-label">Preço no cadastro' + addedDate + '</span><span class="dt-value">' + fmtPrice(p.initial_price, p.currency_id) + '</span></div>' +
      '<div class="dt-row"><span class="dt-label">Preço atual</span><span class="dt-value ' + t + '">' + fmtPrice(p.last_price, p.currency_id) + '</span></div>' +
      '<div class="dt-row"><span class="dt-label">Variação</span><span class="dt-value ' + t + '">' + ch + '</span></div>' +
      (p.target_price ? '<div class="dt-row"><span class="dt-label">Meta</span><span class="dt-value" style="color:var(--accent)">' + fmtPrice(p.target_price, p.currency_id) + '</span></div>' : '') +
      '</div>' +

      '<div style="margin-top:16px">' +
      (p.target_price
        ? '<div class="btn" onclick="editTarget()">Alterar meta (' + fmtPrice(p.target_price, p.currency_id) + ')</div><div class="btn red" onclick="removeTarget()">Remover meta</div>'
        : '<div class="btn" onclick="editTarget()">Definir meta de preço</div>') +
      '<div class="btn red" onclick="doRemove()">Parar de monitorar</div></div>' +

      '<div id="chart-container" style="margin-top:16px;min-height:120px"></div></div>';

    render(html);
    loadChart(id);
  }

  function editTarget() {
    if (!selected) return;
    render('<div class="detail"><div class="back-btn" onclick="showDetail(' + selected.id + ')">← Voltar</div>' +
      '<div style="margin-top:8px"><strong>Meta de preço</strong><p style="font-size:13px;color:var(--muted);margin:4px 0 12px">Valor mínimo para ser avisado</p>' +
      '<div class="input-row"><span style="padding:12px 0;font-size:16px;font-weight:600;color:var(--muted)">R$</span>' +
      '<input id="tv" type="number" step="0.01" min="0" placeholder="Ex: 50" autofocus></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px"><div class="btn full" onclick="confirmTarget()">Salvar</div>' +
      '<div class="btn full" onclick="showDetail(' + selected.id + ')">Cancelar</div></div></div>');
    tg.BackButton.onClick(function () { showDetail(selected.id); });
  }

  async function confirmTarget() {
    var input = document.getElementById("tv"); var val = parseFloat((input.value||"").replace(",", "."));
    if (isNaN(val) || val < 0) { showToast("Digite um valor válido"); return; }
    if (val === 0) { removeTarget(); return; }
    var res = await apiPost("/api/action", { action: "set_target", product_id: selected.id, target_price: val });
    if (res && res.ok) { showToast("Meta: " + fmtPrice(val, selected.currency_id)); await loadProducts(); }
    else { showToast("Erro: " + (res ? res.error : "sem resposta")); }
  }

  async function removeTarget() {
    var res = await apiPost("/api/action", { action: "remove_target", product_id: selected.id });
    if (res && res.ok) { showToast("Meta removida"); await loadProducts(); }
    else { showToast("Erro: " + (res ? res.error : "sem resposta")); }
  }

  async function doRemove() {
    if (!selected) return;
    var ok = await tgConfirm("Remover \"" + selected.title.slice(0, 40) + "\"?");
    if (!ok) return;
    var res = await apiPost("/api/action", { action: "remove", product_id: selected.id });
    if (res && res.ok) { showToast("Removido"); await loadProducts(); }
    else { showToast("Erro: " + (res ? res.error : "sem resposta")); }
  }

  // ── Share product (clipboard) ────────────────────────────────────
  function shareProduct() {
    if (!selected) return;
    var link = selected.affiliate_url || selected.url || "";
    if (!link) { showToast("Sem link disponível"); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(link).then(function () { showToast("Link copiado!"); });
    } else {
      var ta = document.createElement("textarea");
      ta.value = link; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); showToast("Link copiado!"); } catch (e) { showToast("Erro ao copiar"); }
      document.body.removeChild(ta);
    }
  }

  // ── Price history chart (SVG, no external deps) ──────────────────
  async function loadChart(productId) {
    var url = API_URL + "/api/products/" + productId + "/history?init_data=" + encodeURIComponent(tg.initData);
    try {
      var r = await fetch(url); var d = await r.json();
      if (!d || !d.ok || !d.history || d.history.length < 2) { return; }
      renderChart(d.history, selected ? selected.target_price : null, selected ? selected.currency_id : "BRL");
    } catch (e) { /* silent fail — chart is optional */ }
  }

  function renderChart(history, targetPrice, currency) {
    var container = document.getElementById("chart-container");
    if (!container) return;
    var points = history.map(function (h) { return { p: parseFloat(h.price), t: new Date(h.recorded_at) }; });

    var minP = Math.min.apply(null, points.map(function (pt) { return pt.p; }));
    var maxP = Math.max.apply(null, points.map(function (pt) { return pt.p; }));
    // Ajuste 4: arredondar para centena
    var yMin = Math.floor(minP / 100) * 100;
    var yMax = Math.ceil((maxP + 1) / 100) * 100;
    if (yMin === yMax) { yMax = yMin + 100; }

    var w = Math.max(280, container.clientWidth - 32);
    var h = 130;
    var padLeft = 50;
    var padRight = 20;
    var chartW = w - padLeft - padRight;
    var chartH = h - 30;

    function x(i) { return padLeft + (i / (points.length - 1)) * chartW; }
    function y(v) { return 10 + chartH - ((v - yMin) / (yMax - yMin)) * chartH; }

    var line = points.map(function (pt, i) { return (i === 0 ? "M" : "L") + x(i).toFixed(1) + "," + y(pt.p).toFixed(1); }).join(" ");

    var targetY = null;
    if (targetPrice && targetPrice >= yMin && targetPrice <= yMax) {
      targetY = y(targetPrice);
    }

    var sym = SYM[currency] || currency + " ";

    // Ajuste 1: mais padding direito para a data nao cortar
    // Ajuste 2: sem emoji na linha da meta

    var svg =
      '<svg viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:auto;display:block">' +
      '<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.15"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
      // Y axis labels (ajuste 4)
      '<text x="' + (padLeft - 8) + '" y="' + (y(yMin) + 4) + '" fill="var(--muted)" font-size="9" text-anchor="end">' + sym + yMin.toFixed(0) + '</text>' +
      '<text x="' + (padLeft - 8) + '" y="' + (y(yMax) + 4) + '" fill="var(--muted)" font-size="9" text-anchor="end">' + sym + yMax.toFixed(0) + '</text>' +
      // Area under line
      '<path d="' + line + 'L' + x(points.length - 1) + ',' + y(yMin) + 'L' + x(0) + ',' + y(yMin) + 'Z" fill="url(#grad)"/>' +
      // Line
      '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      // Dots for each point (ajuste 3: preparado para tooltip)
      points.map(function (pt, i) { return '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(pt.p).toFixed(1) + '" r="2.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="1"/>'; }).join("") +
      // Last price dot bigger
      '<circle cx="' + x(points.length - 1).toFixed(1) + '" cy="' + y(points[points.length - 1].p).toFixed(1) + '" r="3.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="1.5"/>' +
      // Target line (ajuste 2: sem emoji)
      (targetY !== null ? '<line x1="' + padLeft + '" y1="' + targetY.toFixed(1) + '" x2="' + (w - padRight) + '" y2="' + targetY.toFixed(1) + '" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.7"/>' : '') +
      // Date labels for first and last
      '<text x="' + x(0) + '" y="' + (h - 6) + '" fill="var(--muted)" font-size="9" text-anchor="middle">' + fmtDate(points[0].t) + '</text>' +
      '<text x="' + x(points.length - 1) + '" y="' + (h - 6) + '" fill="var(--muted)" font-size="9" text-anchor="middle">' + fmtDate(points[points.length - 1].t) + '</text>' +
      '</svg>';

    // Ajuste 5: subtitulo se produto indisponivel
    var subtitle = "";
    if (selected && selected.last_scrape_status === "unavailable" && selected.last_checked) {
      try { var d = new Date(selected.last_checked); subtitle = '<div style="font-size:11px;color:var(--red);margin-top:6px">Indisponível desde ' + String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getFullYear()).slice(-2) + '</div>'; } catch(e) {}
    }

    container.innerHTML = '<div style="border-top:1px solid var(--border);padding-top:14px;margin-top:4px"><div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600">HISTÓRICO DE PREÇOS</div>' + svg + subtitle + '</div>';
  }

  function fmtDate(date) {
    return String(date.getDate()).padStart(2, "0") + "/" + String(date.getMonth() + 1).padStart(2, "0");
  }

  // ── API ───────────────────────────────────────────────────────────
  async function loadProducts() {
    var url = API_URL + "/api/products?_cb=" + Date.now() + "&init_data=" + encodeURIComponent(tg.initData);
    try {
      var r = await fetch(url); var d = await r.json();
      if (d && d.ok) { allProducts = d.products || []; productsLoaded = true; } else { render('<div class="empty-state"><span class="icon">⚠</span><p>' + esc(d ? d.error : "sem resposta") + '</p></div>'); return; }
    } catch (e) { render('<div class="empty-state"><span class="icon">📡</span><p>Sem conexão<br>' + esc((e.message||"").slice(0, 60)) + '</p></div>'); return; }
    showHome();
  }

  async function apiPost(path, body) {
    body.init_data = tg.initData;
    try { var r = await fetch(API_URL + path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); return await r.json(); }
    catch (e) { return { error: "network_error" }; }
  }

  function tgConfirm(msg) { return new Promise(function (resolve) { tg.showConfirm(msg, function (ok) { resolve(ok); }); }); }

  // ── Exports ───────────────────────────────────────────────────────
  window.showHome = showHome; window.showDetail = showDetail; window.editTarget = editTarget;
  window.confirmTarget = confirmTarget; window.removeTarget = removeTarget; window.doRemove = doRemove;
  window.enterDeleteMode = enterDeleteMode; window.toggleSelect = toggleSelect;
  window.toggleAll = toggleAll; window.confirmDelete = confirmDelete; window.deleteAll = deleteAll;
  window.toggleSortMenu = toggleSortMenu; window.setSort = setSort;
  window.shareProduct = shareProduct;

  renderLoading(); loadProducts();
})();
</script>
</body>
</html>
